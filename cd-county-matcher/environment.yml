# Conda environment for cd-county-matcher.
# Mirrors the py312 setup the project was developed with, plus the geospatial
# dependencies that the matcher itself needs.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate py312
#
# If you want this env registered as a Jupyter kernel (as in the original
# setup), after activating run:
#   python -m ipykernel install --user --name py312 --display-name "Python (py312)"

name: py312
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - ipykernel
  # Geospatial stack — installing from conda-forge is strongly recommended
  # over pip because it ships with the native GDAL/GEOS/PROJ libraries.
  - geopandas>=1.0
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - gdal>=3.8
  - pip
  - pip:
      # Base scientific stack, pinned to the versions the project was
      # developed against.
      - numpy==2.1.1
      - scipy==1.14.1
      - scikit-learn==1.5.1
      - pandas==2.2.2
      - matplotlib==3.9.2
      - seaborn==0.13.2
      # Spatial econometrics (from the original setup).
      - pysal==24.7
      - spreg
      # Matcher-specific dependencies.
      - requests>=2.31
      - urllib3>=2.0
